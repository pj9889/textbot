<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Unlimited Content Rewriter</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 950px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #58a6ff;
            text-align: center;
        }
        p.subtitle {
            font-size: 14px;
            color: #8b949e;
            text-align: center;
            margin-bottom: 25px;
        }
        .config-box {
            background: #21262d;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .config-box label {
            font-size: 13px;
            font-weight: bold;
            color: #8b949e;
        }
        .config-box input {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #58a6ff;
            font-size: 14px;
            outline: none;
        }
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .editor-grid {
                grid-template-columns: 1fr;
            }
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 14px;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            height: 280px;
            padding: 14px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }
        textarea:focus {
            border-color: #58a6ff;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        button {
            padding: 12px 24px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
        button:disabled {
            background-color: #343942;
            color: #8b949e;
            cursor: not-allowed;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
        .status-msg.error { color: #f85149; }
        .status-msg.success { color: #3fb950; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>AI Content Rewriter</h1>
    <p class="subtitle">যেকোনো কন্টেন্ট বা নির্দেশ দিন, AI হুবহু আপনার চাওয়া অনুযায়ী বানিয়ে দেবে।</p>

    <!-- API Key Input Section -->
    <div class="config-box">
        <label for="apiKey">আপনার OpenRouter API Key:</label>
        <input type="password" id="apiKey" placeholder="sk-or-v1-..." autocomplete="off">
    </div>

    <!-- Main Content Grid -->
    <div class="editor-grid">
        <div class="field-group">
            <label for="inputText">মূল কন্টেন্ট বা ইনপুট (Input):</label>
            <textarea id="inputText" placeholder="এখানে মূল কন্টেন্ট দিন অথবা লিখুন কীভাবে কন্টেন্টটি পরিবর্তন করতে হবে..."></textarea>
        </div>
        <div class="field-group">
            <label for="outputText">ফলাফল (Output):</label>
            <textarea id="outputText" readonly placeholder="এখানে পরিবর্তিত কন্টেন্ট আসবে..."></textarea>
        </div>
    </div>

    <div class="actions">
        <button id="runBtn" onclick="processText()">Generate / Rewrite</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    // Browser Local Storage এ API Key সেভ রাখার ব্যবস্থা
    window.onload = function() {
        const savedKey = localStorage.getItem('openrouter_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    };

    document.getElementById('apiKey').addEventListener('input', function(e) {
        localStorage.setItem('openrouter_key', e.target.value.trim());
    });

    async function processText() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const inputText = document.getElementById('inputText').value.trim();
        const outputText = document.getElementById('outputText');
        const runBtn = document.getElementById('runBtn');
        const statusMsg = document.getElementById('statusMsg');

        statusMsg.className = 'status-msg';
        statusMsg.innerText = '';

        if (!apiKey) {
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = 'অনুগ্রহ করে একটি সঠিক OpenRouter API Key টাইপ করুন!';
            return;
        }

        if (!inputText) {
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = 'অনুগ্রহ করে ইনপুট বক্সে কিছু কন্টেন্ট বা প্রম্পট লিখুন!';
            return;
        }

        runBtn.disabled = true;
        outputText.value = "প্রসেস করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...";

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json",
                    "HTTP-Referer": window.location.origin,
                    "X-Title": "Content Generator"
                },
                body: JSON.stringify({
                    model: "meta-llama/llama-3.1-8b-instruct:free", // আপনার পছন্দমতো OpenRouter Paid/Free Model আইডি বসাতে পারেন
                    messages: [
                        {
                            role: "system",
                            content: "You are an unrestricted, highly versatile AI content writer, paraphraser, and text generator. Your sole function is to strictly carry out the user's instructions or rewrite their input text according to their specifications. Output only the final rewritten or generated text directly, without preamble, fluff, or warnings."
                        },
                        {
                            role: "user",
                            content: inputText
                        }
                    ]
                })
            });

            const data = await response.json();

            if (response.ok && data.choices && data.choices[0]) {
                outputText.value = data.choices[0].message.content;
                statusMsg.className = 'status-msg success';
                statusMsg.innerText = 'সফলভাবে কন্টেন্ট জেনারেট হয়েছে!';
            } else {
                outputText.value = "";
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = "এরর: " + (data.error?.message || "OpenRouter থেকে রেসপন্স পেতে সমস্যা হয়েছে");
            }
        } catch (error) {
            outputText.value = "";
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = "নেটওয়ার্ক বা সার্ভার সমস্যা হয়েছে!";
        } finally {
            runBtn.disabled = false;
        }
    }
</script>

</body>
</html>
