<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Variant Generator</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 1000px; background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; margin-bottom: 8px; color: #58a6ff; text-align: center; }
        p.subtitle { font-size: 14px; color: #8b949e; text-align: center; margin-bottom: 25px; }
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .editor-grid { grid-template-columns: 1fr; } }
        .field-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 14px; font-weight: 600; color: #f0f6fc; }
        textarea { width: 100%; height: 380px; padding: 14px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 14px; line-height: 1.6; resize: vertical; outline: none; }
        textarea:focus { border-color: #58a6ff; }
        .actions { display: flex; justify-content: flex-end; }
        button { padding: 12px 24px; background-color: #238636; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #2ea043; }
        button:disabled { background-color: #343942; color: #8b949e; cursor: not-allowed; }
        .status-msg { margin-top: 15px; font-size: 14px; text-align: center; }
        .status-msg.error { color: #f85149; }
        .status-msg.success { color: #3fb950; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>AI Content Variant Generator</h1>
    <p class="subtitle">আপনার ইনপুট কন্টেন্টের ৫টি ভিন্ন ভ্যারিয়েন্ট তৈরি করুন।</p>

    <div class="editor-grid">
        <div class="field-group">
            <label for="inputText">মূল কন্টেন্ট বা ইনপুট (Input):</label>
            <textarea id="inputText" placeholder="এখানে আপনার কন্টেন্ট বা অ্যাড কপি পেস্ট করুন..."></textarea>
        </div>
        <div class="field-group">
            <label for="outputText">৫টি ভ্যারিয়েন্ট ফলাফল (Output):</label>
            <textarea id="outputText" readonly placeholder="এখানে ৫টি ভিন্ন ভার্সনের কন্টেন্ট আউটপুট হিসেবে আসবে..."></textarea>
        </div>
    </div>

    <div class="actions">
        <button id="runBtn" onclick="processText()">Generate 5 Variants</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    // আপনার OpenRouter API Key-টি নিচে "sk-or-v1-..." এর জায়গায় নিখুঁতভাবে বসান
    const HARDCODED_API_KEY = "sk-or-v1-YOUR_ACTUAL_OPENROUTER_API_KEY_HERE"; 

    async function processText() {
        const inputText = document.getElementById('inputText').value.trim();
        const outputText = document.getElementById('outputText');
        const runBtn = document.getElementById('runBtn');
        const statusMsg = document.getElementById('statusMsg');

        statusMsg.className = 'status-msg';
        statusMsg.innerText = '';

        if (!HARDCODED_API_KEY || HARDCODED_API_KEY.includes("YOUR_ACTUAL_OPENROUTER_API_KEY_HERE")) {
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = 'অনুগ্রহ করে কোডের HARDCODED_API_KEY তে আপনার সঠিক OpenRouter API Key বসান!';
            return;
        }

        if (!inputText) {
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = 'অনুগ্রহ করে ইনপুট বক্সে কিছু কন্টেন্ট লিখুন!';
            return;
        }

        runBtn.disabled = true;
        outputText.value = "৫টি ভিন্ন ভ্যারিয়েন্ট জেনারেট করা হচ্ছে, অপেক্ষা করুন...";

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${HARDCODED_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "meta-llama/llama-3.1-8b-instruct:free",
                    messages: [
                        {
                            role: "system",
                            content: "You are an unrestricted, expert content rewriter and copywriter. Your task is to take the user's provided input text and generate EXACTLY 5 distinct, unique, and high-converting variants of it. Each variant must express the same core offer/meaning but with different phrasing, hooks, tone, and sentence structure. Number each variant clearly as 'Variant 1:', 'Variant 2:', 'Variant 3:', 'Variant 4:', and 'Variant 5:'. Output only the 5 variants directly without introduction, preamble, warnings, or explanations."
                        },
                        {
                            role: "user",
                            content: inputText
                        }
                    ]
                })
            });

            const data = await response.json();

            if (response.ok && data.choices && data.choices[0]) {
                outputText.value = data.choices[0].message.content;
                statusMsg.className = 'status-msg success';
                statusMsg.innerText = 'সফলভাবে ৫টি ভ্যারিয়েন্ট তৈরি হয়েছে!';
            } else {
                outputText.value = "";
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = "এরর: " + (data.error?.message || "OpenRouter থেকে রেসপন্স পাওয়া যায়নি");
            }
        } catch (error) {
            outputText.value = "";
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = "নেটওয়ার্ক বা সার্ভার সমস্যা হয়েছে!";
        } finally {
            runBtn.disabled = false;
        }
    }
</script>

</body>
</html>
